name: Generate Project Index

on:
  push:
    branches: [dev]       # ✅ Only triggers on push to dev
  workflow_dispatch:      # ✅ Optional: lets you trigger manually
  schedule:              # ✅ Optional: lets you set a cron job
    - cron: '0 0 * * *'   # ✅ Every day at midnight UTC
  repository_dispatch: # ✅ Optional: lets you trigger from another workflow
    types: [project-json-update] # ✅ Only triggers on this event type

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate project index
        run: python frontend/scripts/generate_index.py
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add frontend/src/data/projectIndex.json
          git commit -m "🔄 Auto-update project index" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}   # ✅ Required for push
          
